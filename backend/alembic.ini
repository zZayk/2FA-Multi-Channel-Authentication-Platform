# =============================================================================
# Alembic config — points at app/core/database.py for the actual URL.
# sqlalchemy.url is intentionally left blank: env.py loads it from Settings,
# which itself reads .env / environment variables. One source of truth.
# =============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

# Format migration filenames as: 0001_short_description.py
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# Run ruff format on every new migration file.
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S